name: FlagGuard AI Governance & Auto-Remediation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FlagGuard Audit
        env:
          CI: "true"
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_PROJECT_ID: ${{ secrets.FLAGSMITH_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_audit.py --repo ./sample-repo --repo-tier staging --markdown-out audit_report.md

      - name: Post PR Audit Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: audit_report.md
          
      - name: Clean up temporary report
        run: rm -f audit_report.md    

      - name: Run AST Unwrapper & pytest Gate (Auto-PR Mode)
        if: github.event_name == 'workflow_dispatch'
        env:
          CI: "true"
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_PROJECT_ID: ${{ secrets.FLAGSMITH_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent_audit.py --repo ./sample-repo --repo-tier staging --auto-unwrap
          pytest sample-repo -v

      - name: Open Automated Cleanup Pull Request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(flagguard): unwrap stale feature flags"
          title: "chore(flagguard): autonomous stale feature flag cleanup"
          body: |
            Automated dead-code unwrapping generated by **FlagGuard AI** (`DeadFlagUnwrapper`) and verified against `pytest`.
          branch: flagguard/auto-cleanup
          base: main

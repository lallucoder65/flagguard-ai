name: FlagGuard PR Feature-Flag Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-feature-flags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FlagGuard Audit
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FLAGSMITH_PROJECT_ID: "54836"
        run: |
          python agent_audit.py --repo ./sample-repo --repo-tier production --markdown-out audit_report.md

      - name: Post Audit Summary to Pull Request
        if: always() && hashFiles('audit_report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit_report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });